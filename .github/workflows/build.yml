name: build

# Every push and pull request: build the PS2 ELF and the PSP EBOOT and run
# the level tests; build the Game Boy Color demo ROM and play its levels in
# an emulator. Pushing a version tag (v1.2.0, or v1.3.0-rc1 for a
# pre-release) also publishes a GitHub release with the PS2 and PSP builds
# once their jobs pass.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  ps2:
    name: PS2 ELF
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install build tools
        run: apk add --no-cache build-base git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown on the title screen
      - name: Build
        run: |
          # the checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: pulsedash-ps2
          path: build/ps2/PULSEDASH.ELF

  psp:
    name: PSP EBOOT
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Install build tools
        run: apk add --no-cache make git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown on the title screen
      - name: Build
        run: |
          # the checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -f Makefile.psp -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: pulsedash-psp
          path: build/psp/EBOOT.PBP

  host:
    name: PC build and level tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: make -f Makefile.host -j"$(nproc)"
      - name: Test (data checks, smoke test, solver, rhythm, coins, contrast)
        run: make -f Makefile.host test
      - name: Test the PSP's widescreen layout (smoke test, title screen demo)
        run: |
          make -f Makefile.host PSP=1 -j"$(nproc)"
          build/host-psp/pd_tool smoke
          build/host-psp/pd_tool demo

  gbc:
    name: Game Boy Color ROM and emulator test
    runs-on: ubuntu-24.04 # its SDCC, 4.2.0, is the one the ROM's timing was measured with
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown on the title screen
      - name: Install SDCC and SDL2
        run: sudo apt-get update && sudo apt-get install -y sdcc libsdl2-dev
      - name: Cache GBDK-2020
        uses: actions/cache@v4
        with:
          path: build/gbdk
          key: gbdk-${{ runner.os }}-${{ hashFiles('scripts/build-gbc.sh') }}
      - name: Build (GBDK-2020 from source unless cached, then the ROM)
        run: scripts/build-gbc.sh
      - name: Check the Game Boy's physics gives the reference's results (the levels are proven on those)
        run: build/host/gbc_tool difftest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Play every level in an emulator (PyBoy), as the reference on every tick, each frame on time
        run: |
          pip install pyboy==2.7.0
          python scripts/gbc-emu-test.py
      - uses: actions/upload-artifact@v4
        with:
          name: pulsedash-gbc
          path: build/gbc/pulsedash.gbc

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ps2, psp, host, gbc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pulsedash-ps2
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pulsedash-psp
          path: psp
      - uses: actions/download-artifact@v4
        with:
          name: pulsedash-gbc
          path: gbc
      - name: Package
        run: |
          ver="$GITHUB_REF_NAME"
          mkdir -p "pkg/pulsedash-$ver"
          cp dist/PULSEDASH.ELF README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md "pkg/pulsedash-$ver/"
          (cd pkg && zip -r "../dist/pulsedash-$ver.zip" "pulsedash-$ver")
          # PSP: the folder layout of the memory stick, ready to unzip onto it
          mkdir -p "pkg-psp/PSP/GAME/PulseDash"
          cp psp/EBOOT.PBP "pkg-psp/PSP/GAME/PulseDash/"
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md "pkg-psp/PSP/GAME/PulseDash/"
          (cd pkg-psp && zip -r "../dist/pulsedash-$ver-psp.zip" PSP)
          # Game Boy Color: the ROM, alone and with the documents
          cp gbc/pulsedash.gbc "dist/pulsedash-$ver.gbc"
          mkdir -p "pkg-gbc/pulsedash-$ver-gbc"
          cp gbc/pulsedash.gbc README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md docs/GBC_PORT.md "pkg-gbc/pulsedash-$ver-gbc/"
          (cd pkg-gbc && zip -r "../dist/pulsedash-$ver-gbc.zip" "pulsedash-$ver-gbc")
          (cd dist && sha256sum PULSEDASH.ELF "pulsedash-$ver.zip" "pulsedash-$ver-psp.zip" "pulsedash-$ver.gbc" \
              "pulsedash-$ver-gbc.zip" > SHA256SUMS)
          ls -l dist
      - name: Release notes
        run: |
          ver="$GITHUB_REF_NAME"
          # this version's section of CHANGELOG.md ("## [1.0.0] - date" up to the next heading)
          awk -v h="## [${ver#v}]" 'index($0, h) == 1 { on = 1; next }
                                   on && (/^## / || /^\[[^]]*\]: /) { exit }
                                   on { print }' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::warning::CHANGELOG.md has no section for ${ver#v}"
          fi
          {
            echo "**PS2:** copy \`PULSEDASH.ELF\` to a USB stick or memory card and start it from wLaunchELF /"
            echo "uLaunchELF or OPL's apps list, or boot it in an emulator (Play! or PCSX2). \`pulsedash-$ver.zip\`"
            echo "holds the same ELF with the README, changelog and licenses."
            echo ""
            echo "**PSP:** unzip \`pulsedash-$ver-psp.zip\` onto the memory stick (it creates"
            echo "\`PSP/GAME/PulseDash/EBOOT.PBP\`) and start Pulse Dash from the Game menu, on a PSP with custom"
            echo "firmware, a PS Vita with Adrenaline, or in PPSSPP."
            echo ""
            echo "**Game Boy Color:** \`pulsedash-$ver.gbc\` runs in any Game Boy Color emulator, and on a Game Boy"
            echo "Color, Game Boy Advance or Analogue Pocket from a flash cartridge with save RAM. \`pulsedash-$ver-gbc.zip\`"
            echo "holds the same ROM with the README, changelog, licenses and docs/GBC_PORT.md."
            echo ""
            cat changes.md
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$GITHUB_REF_NAME"
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          gh release create "$ver" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "Pulse Dash $ver" --notes "$(cat notes.md)" --generate-notes \
            dist/PULSEDASH.ELF "dist/pulsedash-$ver.zip" "dist/pulsedash-$ver-psp.zip" \
            "dist/pulsedash-$ver.gbc" "dist/pulsedash-$ver-gbc.zip" dist/SHA256SUMS
