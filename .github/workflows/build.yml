name: build

# Every push and pull request: build the PS2 ELF and run the level tests.
# Pushing a version tag (v1.2.0, or v1.3.0-rc1 for a pre-release) also
# publishes a GitHub release with the ELFs once both jobs pass.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  ps2:
    name: PS2 ELF
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install build tools
        run: apk add --no-cache build-base git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown on the title screen
      - name: Build
        run: |
          # the checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: pulsedash-ps2
          path: |
            build/ps2/pulsedash.elf
            build/ps2/pulsedash-packed.elf

  host:
    name: PC build and level tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: make -f Makefile.host -j"$(nproc)"
      - name: Test (data checks, smoke test, solver, rhythm, coins)
        run: make -f Makefile.host test

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ps2, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pulsedash-ps2
          path: dist
      - name: Package
        run: |
          ver="$GITHUB_REF_NAME"
          mkdir -p "pkg/pulsedash-$ver"
          cp dist/pulsedash-packed.elf dist/pulsedash.elf README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md \
             "pkg/pulsedash-$ver/"
          (cd pkg && zip -r "../dist/pulsedash-$ver.zip" "pulsedash-$ver")
          (cd dist && sha256sum pulsedash-packed.elf pulsedash.elf "pulsedash-$ver.zip" > SHA256SUMS)
          ls -l dist
      - name: Release notes
        run: |
          ver="$GITHUB_REF_NAME"
          # this version's section of CHANGELOG.md ("## [1.0.0] - date" up to the next heading)
          awk -v h="## [${ver#v}]" 'index($0, h) == 1 { on = 1; next }
                                   on && (/^## / || /^\[[^]]*\]: /) { exit }
                                   on { print }' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::warning::CHANGELOG.md has no section for ${ver#v}"
          fi
          {
            echo "Copy \`pulsedash-packed.elf\` to a USB stick and start it from wLaunchELF / uLaunchELF or"
            echo "OPL's apps list, or boot it in an emulator (Play! or PCSX2). \`pulsedash.elf\` is the same game"
            echo "unpacked; the zip holds both ELFs with the README, changelog and licenses."
            cat changes.md
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$GITHUB_REF_NAME"
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          gh release create "$ver" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "Pulse Dash $ver" --notes "$(cat notes.md)" --generate-notes \
            dist/pulsedash-packed.elf dist/pulsedash.elf "dist/pulsedash-$ver.zip" dist/SHA256SUMS
